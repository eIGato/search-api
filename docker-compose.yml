services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: search
      POSTGRES_PASSWORD: search
      POSTGRES_DB: search
    ports:
      # 5433 on the host to avoid clashing with a locally running Postgres.
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U search -d search"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://search:search@db:5432/search
      # Optional, read from the shell or a .env file next to this compose file.
      API_KEY: ${API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
